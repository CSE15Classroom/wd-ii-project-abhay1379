<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="navbar">
            <div class="nav-logo">
                <div class="logo">Amazon.in</div>
            </div>
            
            <div class="nav-search">
                <input type="text" id="search-input" placeholder="Search Amazon.in" class="search-input">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div class="nav-cart" id="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-count">0</span>
                <p>Cart</p>
            </div>
        </div>
    </header>

    <main>
        <section class="shop-section">
            <h2>Trending Products</h2>
            <div class="products-container" id="products-grid">
                </div>
        </section>

        <section class="cart-modal" id="cart-modal">
            <div class="cart-content">
                <span class="close-cart" id="close-cart">&times;</span>
                <h2>Your Shopping Cart</h2>
                <div class="cart-items" id="cart-items">
                    </div>
                <div class="cart-total">
                    <h3>Total: ₹<span id="total-price">0</span></h3>
                    <button class="checkout-btn" id="checkout-btn">Proceed to Buy</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Amazon Clone - Made with JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
